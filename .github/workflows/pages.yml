name: Deploy API docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static documentation
        run: |
          test -s index.html
          test -s assets/styles.css
          node --check assets/app.js
          node --check assets/api-data.js
          node -e 'global.window={}; require("./assets/api-data.js"); const d=window.FBREACH_DOCS; if(!d || d.meta.endpointCount !== 148 || d.meta.groupCount !== 13) process.exit(1); console.log(`Validated ${d.meta.endpointCount} endpoints across ${d.meta.groupCount} sections.`);'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4